# Standard pre-commit config (https://pre-commit.com) -- self-contained, so any clone gets the
# same checks with:
#
#     pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Baseline shared by every repo in this fleet: a PINNED secret scan. `language: golang` means
# pre-commit builds the gitleaks binary into its own environment -- no local install, no "whatever
# version is on PATH", and `rev:` pins it so two machines can't silently run different rules.
#
# Where checks run, and why this repo has these: ai-toolkit/docs/where-checks-run.md

# Two stages, matching where each check earns its cost:
#
#   pre-commit  gitleaks -- cheap, and a secret is worth catching before it exists in history.
#   pre-push    the CI build gate -- the site builds in ~45ms, so running it before a push is
#               free in practice, and a broken build never reaches GitHub.
#
# The pre-push hook mirrors the `site` and `explorables` jobs in .github/workflows/hugo.yml
# rather than reimplementing them: scripts/local_verify.py runs those jobs' commands verbatim. What it
# adds is CI's preconditions -- the pinned Hugo from mise.toml, and a clean output directory,
# because CI builds into a fresh checkout and a working tree does not. Both were real
# failures; the script's docstring records them.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: local-verify
        name: build the site and the explorables and check them (mirrors the CI site and explorables jobs)
        entry: python scripts/local_verify.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # infra/ offline checks, mirroring the `infra` job in the workflow. Only when a push
      # touches infra/ or the pin, because initialising the providers takes a few seconds.
      - id: check-infra
        name: check infra/ offline (mirrors the CI infra job)
        entry: python scripts/check_infra.py
        language: system
        pass_filenames: false
        files: ^(infra/|mise\.toml$|scripts/(check_infra|move_live_tag)\.py$|\.github/workflows/)
        stages: [pre-push]

      # The cost cutoff function's unit tests (standard library only, no network), mirroring
      # the step of the same name in the workflow's `infra` job.
      - id: cost-cutoff-tests
        name: cost cutoff function unit tests (mirrors the CI infra job)
        entry: python -m unittest discover -s infra/cost-cutoff
        language: system
        pass_filenames: false
        files: ^infra/
        stages: [pre-push]
