version: 2

# Why this exists: everything below had drifted badly before it was added. The three
# GitHub Actions were one to three major versions behind, and the PaperMod submodule was
# 50 commits behind upstream across a Hugo template restructure. Nothing surfaced any of
# it -- a pinned version that is merely old produces no error, so it goes unnoticed until
# someone thinks to look.
#
# Both ecosystems open PRs rather than pushing, so every bump still passes through the
# build check in ci and a human review before it reaches the live site.

updates:
  # Weekly, because these are small, mechanical, validated by the build check, and they
  # are the supply-chain surface: a stale action is a real risk, not just untidiness.
  # Grouped so four pinned actions produce one PR instead of up to four -- which also
  # keeps clear of the five-open-PR limit, past which Dependabot silently stops opening
  # new ones.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies

  # The theme. Weekly, which is a change of mind worth recording.
  #
  # It was monthly because a theme bump needs a real look at rendered output -- one broke
  # the CSP hash, the homepage typography and the twitter:description at once -- and a
  # cadence that outruns the review it needs gets batch-ignored.
  #
  # The comparison report added to ci changed that. A theme PR now arrives already saying
  # which elements lost styling, which values drifted and whether an inline script's hash
  # moved, so reviewing one is reading a summary rather than building it locally and
  # squinting at a screenshot. With review cheap, smaller diffs win: two or three commits
  # is far easier to reason about than ten when something does break. And the failure this
  # is really guarding against is silent 50-commit drift, which is much worse than PR noise.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(theme)"
    labels:
      - dependencies
