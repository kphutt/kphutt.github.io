version: 2

# Why this exists: everything below had drifted badly before it was added. The three
# GitHub Actions were one to three major versions behind, and the PaperMod submodule was
# 50 commits behind upstream across a Hugo template restructure. Nothing surfaced any of
# it -- a pinned version that is merely old produces no error, so it goes unnoticed until
# someone thinks to look.
#
# Both ecosystems open PRs rather than pushing, so every bump still passes through the
# build check in ci and a human review before it reaches the live site.

updates:
  # Weekly, because these are small, mechanical, validated by the build check, and they
  # are the supply-chain surface: a stale action is a real risk, not just untidiness.
  # Grouped so four pinned actions produce one PR instead of up to four -- which also
  # keeps clear of the five-open-PR limit, past which Dependabot silently stops opening
  # new ones.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies

  # The theme. Dependabot tracks the submodule's remote branch, which moves constantly, so
  # every run finds something -- weekly would produce a PR nearly every week.
  #
  # Monthly instead, for two reasons. These are NOT rubber stamps: one bump broke the CSP
  # hash, the homepage typography and the twitter:description all at once, so each needs a
  # real look at rendered output. And a cadence that outruns the review it needs gets
  # batch-ignored, which is how the theme silently fell 50 commits behind in the first
  # place. Monthly keeps each diff to roughly ten commits, which is still reviewable.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(theme)"
    labels:
      - dependencies
