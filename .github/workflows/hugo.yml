name: Build and deploy

# Builds and checks the site on every pull request, and on merge to main deploys it to
# Cloud Run, blue-green (docs/design/site-move.md). The deploy job skips itself until the
# WIF_PROVIDER repository variable is set (infra/README.md).
#
# Pushes rebuild the site, and this monthly run covers the months without one, so
# security.txt's Expires date (180 days out) doesn't lapse. But GitHub pauses schedules
# after 60 days without repository activity. If that happens, re-enable this workflow in the
# Actions tab.
#
# The required status check is `build`, a summary job at the end that passes only when
# the site build (`site`), the container smoke test (`image`) and the infra checks
# (`infra`) all pass. Branch protection names one check, and it covers all three.
#
# The file name is part of the Cloud Run trust: infra/identities.tf allows only this file
# and rollback.yml, on main, to deploy. Renaming it means changing that list too.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *" # the 1st of each month, 06:17 UTC

# Least privilege by default. Only the deploy job widens this for itself, so a build
# triggered by a pull request never holds a token that can publish anywhere.
permissions:
  contents: read

# Deploys to main serialise; pull request builds get their own lane per branch and
# supersede themselves, so a PR build can never queue behind or delay a deploy.
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      # The build's output is what Cloud Run serves, so the binary that makes it is checked
      # against the checksum file Hugo publishes with each release before it is installed.
      - name: Install Hugo CLI
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget -q "${base}/${deb}" "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${deb}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          sudo dpkg -i "${deb}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          # Hugo templates can read files in the project, so the token stays out of .git.
          persist-credentials: false
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        # No --baseURL flag on purpose. It once came from the repo's GitHub Pages settings
        # (actions/configure-pages), and with "Enforce HTTPS" off it silently emitted
        # http://kphutt.com into every canonical tag, og:url, RSS link and sitemap entry.
        # hugo.toml is the source of truth instead, which also keeps the built URLs correct
        # no matter what sits in front of the site (a CDN or proxy). Do not re-add it.
        run: |
          hugo \
            --gc \
            --minify
      - name: Check the built site
        run: python3 scripts/check_build.py public | tee "${{ runner.temp }}/check.txt"

      # The check output carries the diagnosis: which page, which inline code or which
      # weakened directive. In a job log nobody reads it. The job summary renders on the
      # run page and needs no permissions at all, which matters because Dependabot-
      # triggered runs get a restricted token -- and Dependabot PRs are precisely the
      # ones where this output is worth reading.
      - name: Report the check result
        if: always()
        run: |
          {
            echo '### Build check'
            echo
            echo '```'
            cat "${{ runner.temp }}/check.txt" 2>/dev/null || echo 'check did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything above answers "is this shippable". This answers "what actually moved",
      # which no pass/fail check can. A theme update once moved its typography rules onto
      # a new class; the overridden homepage kept the old one and lost every margin, with
      # byte-identical HTML and a green build. Report only -- it never fails the job.
      - name: Check out the base branch, to compare against
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          submodules: recursive
          path: .base
          persist-credentials: false
      - name: Report what this PR changes in the built site
        if: github.event_name == 'pull_request'
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo --gc --minify -s .base -d public
          python3 scripts/compare_builds.py .base/public public \
            --title 'What this PR changes in the built site' >> "$GITHUB_STEP_SUMMARY"

      # The checked build, for the container image. The image job copies exactly these
      # files, so what Cloud Run serves is what check_build.py passed.
      - name: Keep the checked build for the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public/
          # Keep .well-known/ (security.txt). The action skips hidden folders by default.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # infra/ offline: formatting, validity and the plan tests (mocked providers, so no GCP
  # access and no credentials). The same script runs at pre-push when infra/ changes.
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the OpenTofu pin from mise.toml
        id: pin
        run: python3 -c 'import re; print("version=" + re.search(r"^opentofu\s*=\s*\"([^\"]+)\"", open("mise.toml").read(), re.M).group(1))' >> "$GITHUB_OUTPUT"
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.pin.outputs.version }}
          tofu_wrapper: false
      - name: Check infra
        run: python3 scripts/check_infra.py
      - name: Cost cutoff function unit tests
        run: python3 -m unittest discover -s infra/cost-cutoff

  # Build the container from the checked site, run it, and smoke-test it on the runner:
  # every sitemap page, the feeds, robots.txt, llms.txt, the 404 page, and every security
  # header from server/sws.toml. Runs on pull requests too, so a change that breaks the
  # image or a header fails review, not the deploy.
  image:
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the checked build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: public/
      - name: Build the image
        run: docker build --pull -t site:candidate .
      - name: Run it and smoke-test it
        run: |
          docker run -d --name site -p 8080:8080 --read-only site:candidate
          python3 scripts/smoke.py --local http://127.0.0.1:8080
      - name: Show the server log if the smoke test failed
        if: failure()
        run: docker logs site || true
      - name: Keep the image for the deploy job
        if: github.event_name != 'pull_request'
        run: docker save site:candidate | gzip > "${{ runner.temp }}/site-image.tar.gz"
      - name: Upload the image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-image
          path: ${{ runner.temp }}/site-image.tar.gz
          retention-days: 7
          if-no-files-found: error

  # Blue-green deploy to Cloud Run, keyless (Workload Identity Federation, no service
  # account key exists). The image pushed is the one the image job just smoke-tested.
  #
  #   1. push it, and resolve its immutable digest;
  #   2. deploy that digest as a new revision with no traffic, reachable only at its own
  #      tagged URL;
  #   3. smoke-test the tagged URL;
  #   4. pass: send 100% of traffic to that exact revision. Fail: change nothing, and the
  #      previous revision keeps serving.
  #
  # rollback.yml points traffic back at any earlier revision by name.
  cloud-run:
    needs: [site, image, infra]
    if: github.event_name != 'pull_request' && vars.WIF_PROVIDER != ''
    runs-on: ubuntu-24.04
    # The Google identity trusts only tokens from this environment (infra/identities.tf),
    # so a job that does not name it cannot use that identity.
    environment: cloud-run
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token WIF exchanges; nothing else
    # Shared with rollback.yml: one change to the traffic split at a time, never cancelled
    # halfway through.
    concurrency:
      group: cloud-run-traffic
      cancel-in-progress: false
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REPO }}/site:${{ github.sha }}
    steps:
      - name: Checkout (for the smoke test and its expected headers)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-image
          path: ${{ runner.temp }}
      - name: Load it
        run: gunzip -c "${{ runner.temp }}/site-image.tar.gz" | docker load
      - name: Authenticate to Google Cloud (WIF, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Push the image and resolve its digest
        run: |
          # A short tag keeps the candidate's URL inside DNS's 63-character label limit.
          echo "CAND_TAG=cand-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker tag site:candidate "$IMAGE"
          docker push "$IMAGE"
          digest=$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')
          python3 -c 'import re,sys; sys.exit(0 if re.fullmatch(r"sha256:[0-9a-f]{64}", sys.argv[1]) else "no digest for the pushed image: " + repr(sys.argv[1]))' "$digest"
          echo "IMAGE_DIGEST=${IMAGE%:*}@${digest}" >> "$GITHUB_ENV"
      # No --tag and no --revision-suffix on the update: either one makes gcloud write the
      # revision's name into the service template. infra/cloud-run.tf would then send that
      # same name with its next template change, and Cloud Run refuses a second revision
      # under an existing name (409). Without them Cloud Run names the revision and the
      # template keeps no name. The tag goes on in a second call, by revision name.
      - name: Deploy the candidate revision at 0% traffic
        run: |
          gcloud run services update "$SERVICE" \
            --image="$IMAGE_DIGEST" \
            --region="$GCP_REGION" --project="$GCP_PROJECT" \
            --no-traffic --quiet
          rev=$(gcloud run services describe "$SERVICE" \
            --region="$GCP_REGION" --project="$GCP_PROJECT" --format='value(status.latestCreatedRevisionName)')
          # The newest revision must run the image just pushed, so a revision made by
          # anything else in between is never tagged, smoke-tested or promoted.
          image=$(gcloud run revisions describe "$rev" \
            --region="$GCP_REGION" --project="$GCP_PROJECT" --format='value(spec.containers[0].image)')
          python3 -c 'import sys; sys.exit(0 if sys.argv[1] == sys.argv[2] else f"newest revision {sys.argv[3]!r} runs {sys.argv[1]!r}, not {sys.argv[2]!r}")' "$image" "$IMAGE_DIGEST" "$rev"
          gcloud run services update-traffic "$SERVICE" \
            --region="$GCP_REGION" --project="$GCP_PROJECT" \
            --update-tags="${CAND_TAG}=${rev}" --quiet
          gcloud run services describe "$SERVICE" \
            --region="$GCP_REGION" --project="$GCP_PROJECT" --format=json > "${{ runner.temp }}/service.json"
          CAND_REV="$rev" python3 - "${{ runner.temp }}/service.json" <<'PY'
          import json, os, sys
          tag = os.environ["CAND_TAG"]
          entries = [t for t in json.load(open(sys.argv[1]))["status"].get("traffic", []) if t.get("tag") == tag]
          if len(entries) != 1 or not entries[0].get("url") or entries[0].get("revisionName") != os.environ["CAND_REV"]:
              sys.exit(f"could not find the candidate revision {os.environ['CAND_REV']} under tag {tag}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CAND_URL={entries[0]['url']}\nCAND_REV={entries[0]['revisionName']}\n")
          print(f"Candidate {entries[0]['revisionName']} at {entries[0]['url']}, 0% traffic")
          PY
      - name: Smoke-test the candidate
        run: python3 scripts/smoke.py "$CAND_URL"
      - name: Promote the smoke-tested revision
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region="$GCP_REGION" --project="$GCP_PROJECT" \
            --to-revisions="${CAND_REV}=100" --quiet
          # The registry's cleanup policy keeps the image tagged live, so the image that is
          # serving can never be deleted out from under a cold start. Moving an existing
          # tag is tags.update, which the deployer's writer role has; `docker tags add`
          # deletes and recreates it, which needs tags.delete, which it does not.
          python3 scripts/move_live_tag.py "${IMAGE%:*}" "${IMAGE_DIGEST#*@}"
          echo "### Deployed \`${CAND_REV}\` to 100% of Cloud Run traffic" >> "$GITHUB_STEP_SUMMARY"
      # Guarded on the tag, not the revision: a candidate that failed after being tagged
      # (its startup probe, say) must not leave its unverified URL reachable.
      - name: Remove the candidate tag
        if: always()
        run: |
          if [ -n "${CAND_TAG:-}" ]; then
            gcloud run services update-traffic "$SERVICE" \
              --region="$GCP_REGION" --project="$GCP_PROJECT" \
              --remove-tags="$CAND_TAG" --quiet || true
          fi

  # The one required status check. It passes only if every check above passed (a
  # skipped job counts as a failure here), so the container and infra checks gate a merge
  # as firmly as the site build does.
  build:
    needs: [site, image, infra]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ needs.site.result }} ${{ needs.image.result }} ${{ needs.infra.result }}
        run: |
          echo "site, image, infra: $RESULTS"
          python3 -c 'import os,sys; r=os.environ["RESULTS"].split(); sys.exit(0 if r == ["success"]*3 else "a required check did not pass")'
