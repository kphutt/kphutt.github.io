name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Only the deploy job widens this for itself, so a build
# triggered by a pull request never holds a token that can publish to Pages.
permissions:
  contents: read

# Deploys to main serialise; pull request builds get their own lane per branch and
# supersede themselves, so a PR build can never queue behind or delay a deploy.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        # No --baseURL flag on purpose. It would override the baseURL in hugo.toml with
        # whatever actions/configure-pages reports, and that value follows the repo's Pages
        # "Enforce HTTPS" setting -- so with the setting off it silently emitted
        # http://kphutt.com into every canonical tag, og:url, RSS link and sitemap entry.
        # hugo.toml is the source of truth instead, which also keeps the built URLs correct
        # no matter what sits in front of the site (a CDN or proxy). Do not re-add it.
        run: |
          hugo \
            --gc \
            --minify
      - name: Check the built site
        run: python3 scripts/check_build.py public | tee "${{ runner.temp }}/check.txt"

      # The check output carries the diagnosis and, for a CSP hash mismatch, the exact
      # replacement value. In a job log nobody reads it. The job summary renders on the
      # run page and needs no permissions at all, which matters because Dependabot-
      # triggered runs get a restricted token -- and Dependabot PRs are precisely the
      # ones where this output is worth reading.
      - name: Report the check result
        if: always()
        run: |
          {
            echo '### Build check'
            echo
            echo '```'
            cat "${{ runner.temp }}/check.txt" 2>/dev/null || echo 'check did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything above answers "is this shippable". This answers "what actually moved",
      # which no pass/fail check can. A theme update once moved its typography rules onto
      # a new class; the overridden homepage kept the old one and lost every margin, with
      # byte-identical HTML and a green build. Report only -- it never fails the job.
      - name: Check out the base branch, to compare against
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          submodules: recursive
          path: .base
      - name: Report what this PR changes in the built site
        if: github.event_name == 'pull_request'
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo --gc --minify -s .base -d public
          python3 scripts/compare_builds.py .base/public public \
            --title 'What this PR changes in the built site' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
