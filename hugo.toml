# baseURL is the single source of truth for every absolute URL Hugo bakes into the
# build: canonical tags, og:url, RSS item links and sitemap entries. The deploy workflow
# deliberately does not pass --baseURL, which would override this.
baseURL = "https://kphutt.com/"
locale = "en-us"          # renamed from languageCode, deprecated in Hugo 0.158
title = "Karsten Huttelmaier"
theme = "PaperMod"

# Root-level keys must stay above the first table header. A bare key written further down
# belongs to whatever table precedes it -- this one previously sat below [[menu.main]] and
# was silently parsed as menu.main[0].enableRobotsTXT, which means nothing to Hugo.
# What actually produces robots.txt is "robots" in outputs.home below; this is the
# documented companion switch, now in the right scope.
enableRobotsTXT = true

# Each page's last-modified date comes from the last commit that touched its file. It
# feeds the sitemap's <lastmod>, dateModified in the structured data and the feed. Without
# it, a page with no date of its own took the newest post's date, so the home page said it
# had not changed since March. The workflow checks out full history (fetch-depth: 0),
# which this needs.
enableGitInfo = true

# No tag or category pages. The site uses neither, so each was an empty list page in the
# sitemap, which gives a search engine a page with nothing on it to crawl and judge.
disableKinds = ["taxonomy", "term"]

# content/LICENSE is the licence for the writing (CC BY 4.0). It sits beside the content it
# covers so the licence travels with it, but it is not part of the site: without this,
# Hugo copies it to /LICENSE in the build output. Matched against the full path, with
# either separator, so it holds on Windows and Linux alike.
ignoreFiles = ['[\\/]content[\\/]LICENSE$']

[module]
  [module.hugoVersion]
    min = "0.158.0"       # `locale` does not exist before this

[params]
  author = "Karsten Huttelmaier"
  description = "I build identity and security infrastructure."
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  # The site runs no JavaScript at all, and its Content Security Policy is script-src
  # 'none'. Each of these switches would otherwise need a script: the code-copy button,
  # the light/dark toggle, and the back-to-top link (which the theme reveals with a script
  # on scroll, so without one it would always be on screen). layouts/partials/footer.html
  # and head.html drop the theme's scripts entirely, so turning one of these back on gives
  # a control that does nothing. scripts/check_build.py fails the build on any inline
  # script.
  ShowCodeCopyButtons = false
  defaultTheme = "light"
  disableThemeToggle = true
  disableScrollToTop = true

  # The social preview card, used for og:image and twitter:image on every page. Without it
  # link previews show a bare URL, and the theme falls back to the small "summary" twitter
  # card instead of the large one. Regenerate with scripts/make_og_image.py.
  images = ["og-image.png"]

[params.label]
  text = "kphutt.com"

  [params.homeInfoParams]
    # We're using content/_index.md instead of this
    enabled = false

  [params.profileMode]
    enabled = false

# The footer licence line. The writing in content/ is CC BY 4.0 (content/LICENSE) and the
# code is Apache-2.0 (LICENSE). The theme renders this after its copyright line, through
# markdownify, so the link is an ordinary outbound <a> and loads nothing.
[params.footer]
  text = "Writing licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"

# Structured data for the home page. The theme reads both of these, so no template
# override is needed.
#
# publisherType defaults to "Organization", which described this site incorrectly: it is
# one person's site, not a company's. The type decides which schema.org entity search and
# answer engines resolve the page to.
#
# sameAs is how an engine learns that this site, that GitHub account and that LinkedIn
# profile are one entity rather than three. It was previously empty, so nothing connected
# them. Only genuinely equivalent profiles belong here.
#
# layouts/partials/templates/schema_json.html renders these, replacing the theme's version
# of that file. It gives the person one @id, https://kphutt.com/#person, and every page
# that mentions the author points at that @id, so the home page and each post describe one
# entity. The owner's other sites, such as explorables.kphutt.com, can reference the same
# @id from their own repositories. The description is
# params.description above. knowsAbout repeats the topics the home page names.
[params.schema]
  publisherType = "Person"
  alternateName = "kphutt"
  knowsAbout = ["Service identity", "PKI", "OAuth", "OpenID Connect"]
  sameAs = [
    "https://github.com/kphutt",
    "https://www.linkedin.com/in/karstenhuttelmaier",
    "https://stackoverflow.com/users/165112/kphutt",
    "https://x.com/kphutt",
    "https://infosec.exchange/@kphutt",
  ]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

# llms.txt is a plain-text index of the site aimed at language models: a title, a short
# summary, then links. The theme ships the output format and a template; this declares the
# format and asks for it on the home page. layouts/_default/llms.txt overrides the theme's
# version to add the summary and a link to the homepage itself.
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

# security.txt (RFC 9116). The page that renders it is content/security.md, which puts it
# at /.well-known/security.txt; its template is layouts/_default/single.securitytxt.txt.
# robots.txt is not another version of the home page, so the home page does not announce
# it with <link rel="alternate">. Crawlers fetch it from its fixed address.
[outputFormats.robots]
  notAlternative = true

[outputFormats.securitytxt]
  mediaType = "text/plain"
  baseName = "security"
  isPlainText = true
  notAlternative = true

[outputs]
  # "robots" must be listed explicitly. enableRobotsTXT alone only adds it to Hugo's
  # DEFAULT home outputs, and declaring this list at all replaces those defaults -- so
  # without it the setting is on, the template exists, and no robots.txt is produced.
  home = ["HTML", "RSS", "llms", "robots"]

[markup]
  # Syntax highlighting with CSS classes, not inline style= attributes. The default
  # (noClasses = true) writes colours into every <span>, which the Content Security
  # Policy's style-src 'self' blocks and scripts/check_build.py fails. The theme's
  # stylesheet already carries the classes' colours.
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
